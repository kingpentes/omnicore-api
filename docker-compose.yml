services:
  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: omnicore-db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-omnicore}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal

  # ── FastAPI Backend ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    container_name: omnicore-api
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-omnicore}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
    depends_on:
      - db
    networks:
      - internal

  # ── Next.js Frontend ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: omnicore-frontend
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api
    networks:
      - internal
      - web_proxy
    labels:
      - "traefik.enable=true"
      # HTTPS
      - "traefik.http.routers.omnicore.rule=Host(`winalite.gou.my.id`)"
      - "traefik.http.routers.omnicore.entrypoints=websecure"
      - "traefik.http.routers.omnicore.tls=true"
      - "traefik.http.routers.omnicore.tls.certresolver=letsencrypt"
      - "traefik.http.services.omnicore.loadbalancer.server.port=3000"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.omnicore-http.rule=Host(`winalite.gou.my.id`)"
      - "traefik.http.routers.omnicore-http.entrypoints=web"
      - "traefik.http.routers.omnicore-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

volumes:
  pgdata:

networks:
  internal:
  web_proxy:
    external: true
